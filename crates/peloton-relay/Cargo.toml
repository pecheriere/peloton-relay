[package]
name = "peloton-relay"
description = "Peloton API relay server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio", "query"] }
clap.workspace = true
peloton = { path = "../peloton", version = "0.2.0" }
reqwest.workspace = true
secrecy.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_path_to_error = "0.1.20"
thiserror.workspace = true
time.workspace = true
tokio = { workspace = true, features = ["net", "signal", "sync", "time"] }
tokio-util = { version = "0.7.20", features = ["rt"] }
tower-http = { version = "0.7.1", default-features = false, features = ["catch-panic"] }
tracing.workspace = true
tracing-subscriber = { workspace = true, features = ["env-filter", "json"] }
url.workspace = true
utoipa.workspace = true

[dev-dependencies]
base64.workspace = true
http-body-util = "0.1"
tempfile.workspace = true
time = { workspace = true, features = ["macros"] }
tower = { version = "0.5", features = ["util"] }
wiremock.workspace = true

[lints]
workspace = true
