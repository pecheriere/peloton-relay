[package]
name = "peloton-relay"
description = "Peloton API relay server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
axum = { workspace = true, features = ["http1", "json", "matched-path", "tokio", "query"] }
clap.workspace = true
peloton.workspace = true
rand.workspace = true
reqwest.workspace = true
secrecy.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_path_to_error.workspace = true
thiserror.workspace = true
time.workspace = true
tokio = { workspace = true, features = ["net", "signal", "sync", "time"] }
tokio-util = { workspace = true, features = ["rt"] }
tower-http = { workspace = true, features = ["catch-panic"] }
tracing.workspace = true
tracing-subscriber = { workspace = true, features = ["env-filter", "json"] }
url.workspace = true
utoipa.workspace = true

[dev-dependencies]
base64.workspace = true
http-body-util.workspace = true
tempfile.workspace = true
time = { workspace = true, features = ["macros"] }
tokio = { workspace = true, features = ["process"] }
tower = { workspace = true, features = ["util"] }
wiremock.workspace = true

[lints]
workspace = true
