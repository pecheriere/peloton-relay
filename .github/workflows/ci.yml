name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Bot merges start no push workflow and main does not require branches to be
  # up to date, so this daily run catches a broken main within a day.
  schedule:
    - cron: "41 4 * * *"
  # The release workflow runs these checks on the tagged commit first.
  workflow_call:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  lint-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # rustup reads the channel and components from rust-toolchain.toml, so
      # the version lives in one place and no third-party action is needed.
      - name: Install the Rust toolchain from rust-toolchain.toml
        run: |
          rustup toolchain install --profile minimal
          rustup show active-toolchain
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --workspace --exclude peloton-relay-login --all-targets --all-features -- -D warnings
      - run: cargo test --locked --workspace --exclude peloton-relay-login --all-features
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          arguments: --all-features --locked
          command: check
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          arguments: --all-features --target aarch64-apple-darwin --locked
          command: check

  crate-age:
    # Compares Cargo.lock with the PR's base, so it only runs on pull requests.
    # Nothing stops a push straight to main from skipping it, so the release
    # workflow runs the same check against the previous release tag before it
    # publishes anything.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The PR's merge commit and its first parent, the base it merges into.
          fetch-depth: 2
          persist-credentials: false
      - name: Lint and test the CI scripts
        run: |
          python3 -m venv "$RUNNER_TEMP/lint"
          "$RUNNER_TEMP/lint/bin/pip" install --quiet --require-hashes --only-binary :all: \
            -r .github/requirements-lint.txt
          "$RUNNER_TEMP/lint/bin/ruff" check .github/scripts
          "$RUNNER_TEMP/lint/bin/ruff" format --check .github/scripts
          python3 -I -m unittest discover -s .github/scripts -p 'test_*.py'
      - name: Refuse crate versions published less than 7 days ago
        run: python3 -I .github/scripts/crate_age.py --base HEAD^1

  login-macos:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # rustup reads the channel and components from rust-toolchain.toml, so
      # the version lives in one place and no third-party action is needed.
      - name: Install the Rust toolchain from rust-toolchain.toml
        run: |
          rustup toolchain install --profile minimal
          rustup show active-toolchain
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo clippy --locked -p peloton-relay-login --all-targets --all-features -- -D warnings
      - run: cargo test --locked -p peloton-relay-login --all-features

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          # Both release platforms. The builder stage cross-compiles with zig
          # and the final stage only copies files, so no emulation is needed.
          platforms: linux/arm64,linux/amd64
          push: false
          # Pull requests and main share one build cache. The release workflow's
          # publish job never reads it, so a cache entry cannot reach a
          # published image.
          cache-from: type=gha,scope=docker-build
          cache-to: type=gha,mode=max,scope=docker-build

  report-red-main:
    needs: [lint-test, crate-age, login-macos, docker-build]
    if: >-
      always()
      && (github.event_name == 'push' || github.event_name == 'schedule')
      && github.ref == 'refs/heads/main'
      && (contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write # to open or comment on the one issue
    steps:
      - name: Open or update the issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          COMMIT: ${{ github.sha }}
        run: |
          title="CI failed on main"
          number=$(gh issue list --state open --search "in:title \"$title\"" \
            --json number,title --jq "map(select(.title == \"$title\")) | .[0].number // empty")
          if [ -n "$number" ]; then
            gh issue comment "$number" --body "Still failing at $COMMIT: $RUN_URL"
          else
            gh issue create --title "$title" --body "Failed at $COMMIT: $RUN_URL

          Fix main before merging anything else, and close this issue once main's CI passes."
          fi
