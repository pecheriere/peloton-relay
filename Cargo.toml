[workspace]
resolver = "3"
members = ["crates/peloton", "crates/peloton-relay", "crates/peloton-relay-login"]

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.94"
license = "MIT OR Apache-2.0"
publish = false

[workspace.dependencies]
axum = { version = "0.8", default-features = false }
base64 = "0.23"
clap = { version = "4", features = ["derive"] }
http-body-util = "0.1"
muda = { version = "0.21", default-features = false }
peloton = { path = "crates/peloton", version = "0.2.0" }
rand = "0.10"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
secrecy = { version = "0.10", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_path_to_error = "0.1.20"
sha2 = "0.11"
tao = "0.37"
tempfile = "3"
thiserror = "2"
time = { version = "0.3", features = ["serde", "formatting", "parsing"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tokio-util = "0.7.20"
tower = "0.5"
tower-http = { version = "0.7.1", default-features = false }
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "std"] }
url = "2"
utoipa = { version = "6", features = ["time"] }
wiremock = "0.6"
wry = "0.57"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
