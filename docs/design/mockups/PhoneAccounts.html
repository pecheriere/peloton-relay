<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Accounts</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&amp;family=JetBrains+Mono:wght@500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#5B3BF0}a:hover{color:#4326D6}
</style>
</head>
<body>
<div style="width: 390px; height: 844px; box-sizing: border-box; padding: 60px 20px 28px; background: #F6F6FA; color: #15161F; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; display: flex; flex-direction: column; gap: 20px">
  <header style="display: flex; align-items: center; justify-content: space-between">
    <div style="display: flex; align-items: center; gap: 10px">
      <svg width="36" height="36" viewBox="0 0 64 64" aria-hidden="true"><rect x="15" y="1" width="10" height="28" rx="5" fill="#E9E3FF" transform="rotate(-10 20 28)"></rect><rect x="39" y="1" width="10" height="28" rx="5" fill="#E9E3FF" transform="rotate(10 44 28)"></rect><rect x="18" y="5" width="4" height="19" rx="2" fill="#FFB3C1" transform="rotate(-10 20 28)"></rect><rect x="42" y="5" width="4" height="19" rx="2" fill="#FFB3C1" transform="rotate(10 44 28)"></rect><circle cx="32" cy="42" r="19" fill="#E9E3FF"></circle><rect x="14" y="31" width="36" height="6" rx="3" fill="#FF7A59"></rect><ellipse cx="25" cy="44" rx="2.4" ry="3" fill="#15161F"></ellipse><ellipse cx="39" cy="44" rx="2.4" ry="3" fill="#15161F"></ellipse><circle cx="19" cy="50" r="2.8" fill="#FFB3C1"></circle><circle cx="45" cy="50" r="2.8" fill="#FFB3C1"></circle><ellipse cx="32" cy="50" rx="2.4" ry="1.8" fill="#FF8FA3"></ellipse></svg>
      <span style="font-size: 22px; font-weight: 800; letter-spacing: -0.02em">Relay</span>
    </div>
    <button type="button" aria-label="Settings" style="width: 44px; height: 44px; border-radius: 999px; border: 1px solid #E4E5EE; background: #FFFFFF; display: flex; align-items: center; justify-content: center">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#15161F" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="3"></circle><path d="M12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"></path></svg>
    </button>
  </header>

  <div style="display: flex; flex-direction: column; gap: 4px">
    <h1 style="margin: 0; font-size: 32px; font-weight: 800; letter-spacing: -0.03em">Accounts</h1>
    <div style="font-size: 15px; color: #55586D">3 accounts · 1 needs sign-in</div>
  </div>

  <div style="display: flex; flex-direction: column; gap: 12px">
    <a href="PhoneAccountDark.html" style="text-decoration: none; color: inherit; background: #FFFFFF; border: 1px solid #E4E5EE; border-radius: 20px; padding: 16px; display: flex; gap: 14px; align-items: center">
      <div style="width: 48px; height: 48px; border-radius: 14px; background: #E3F7E7; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 20px; color: #17642A">A</div>
      <div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px">
        <div style="display: flex; justify-content: space-between; align-items: center; gap: 8px">
          <span style="font-weight: 700; font-size: 17px">alice</span>
          <span style="display: inline-flex; align-items: center; gap: 6px; height: 26px; padding: 0 10px; border-radius: 999px; background: #E3F7E7; color: #17642A; font-weight: 700; font-size: 13px"><span style="width: 7px; height: 7px; border-radius: 99px; background: #2FA548"></span>Healthy</span>
        </div>
        <div style="font-size: 13px; color: #55586D">Refreshed 12 min ago · read + write</div>
      </div>
    </a>

    <a href="PhoneAccountDark.html" style="text-decoration: none; color: inherit; background: #FFFFFF; border: 1px solid #F2D58A; border-radius: 20px; padding: 16px; display: flex; gap: 14px; align-items: center">
      <div style="width: 48px; height: 48px; border-radius: 14px; background: #FFF4D6; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 20px; color: #7A5200">B</div>
      <div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px">
        <div style="display: flex; justify-content: space-between; align-items: center; gap: 8px">
          <span style="font-weight: 700; font-size: 17px">bob</span>
          <span style="display: inline-flex; align-items: center; gap: 6px; height: 26px; padding: 0 10px; border-radius: 999px; background: #FFF4D6; color: #7A5200; font-weight: 700; font-size: 13px"><span style="width: 7px; height: 7px; border-radius: 99px; background: #E0A100"></span>Needs sign-in</span>
        </div>
        <div style="font-size: 13px; color: #55586D">Peloton rejected the refresh · 2 h ago</div>
      </div>
    </a>

    <a href="PhoneAccountDark.html" style="text-decoration: none; color: inherit; background: #FFFFFF; border: 1px solid #E4E5EE; border-radius: 20px; padding: 16px; display: flex; gap: 14px; align-items: center">
      <div style="width: 48px; height: 48px; border-radius: 14px; background: #E3F7E7; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 20px; color: #17642A">C</div>
      <div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px">
        <div style="display: flex; justify-content: space-between; align-items: center; gap: 8px">
          <span style="font-weight: 700; font-size: 17px">carol</span>
          <span style="display: inline-flex; align-items: center; gap: 6px; height: 26px; padding: 0 10px; border-radius: 999px; background: #E3F7E7; color: #17642A; font-weight: 700; font-size: 13px"><span style="width: 7px; height: 7px; border-radius: 99px; background: #2FA548"></span>Healthy</span>
        </div>
        <div style="font-size: 13px; color: #55586D">Refreshed 3 min ago · read + write</div>
      </div>
    </a>
  </div>

  <div style="background: #FFFFFF; border: 1px solid #E4E5EE; border-radius: 20px; padding: 16px; display: flex; flex-direction: column; gap: 12px">
    <div style="font-size: 13px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: #55586D">Last 24 h</div>
    <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
      <div style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 22px; font-weight: 800">412</span><span style="font-size: 12px; color: #55586D">requests</span></div>
      <div style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 22px; font-weight: 800">6</span><span style="font-size: 12px; color: #55586D">writes</span></div>
      <div style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 22px; font-weight: 800">1</span><span style="font-size: 12px; color: #55586D">errors</span></div>
    </div>
    <div style="display: flex; height: 8px; border-radius: 99px; overflow: hidden; gap: 2px">
      <div style="flex: 70; background: #2EC4B6"></div><div style="flex: 22; background: #4C9BFF"></div><div style="flex: 6; background: #6D4AFF"></div><div style="flex: 2; background: #FF5C6B"></div>
    </div>
  </div>

  <div style="flex: 1"></div>
  <button type="button" style="height: 52px; border: 0; border-radius: 999px; background: #6D4AFF; color: #FFFFFF; font: 700 17px 'Plus Jakarta Sans', sans-serif; display: flex; align-items: center; justify-content: center; gap: 8px">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>
    Add account
  </button>
</div>
</body>
</html>
