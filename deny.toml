[graph]
all-features = true
# The default audit covers what the relay ships for. The macOS-only login
# helper is audited separately with `--target aarch64-apple-darwin`; mixing
# both would leak wry/tao's Linux GTK edges into the graph.
targets = ["x86_64-unknown-linux-gnu", "aarch64-unknown-linux-gnu"]

[advisories]
version = 2
yanked = "deny"

[licenses]
version = 2
unused-allowed-license = "allow"
allow = [
    "MIT",
    "Apache-2.0",
    "Unicode-3.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "MPL-2.0",
    "CDLA-Permissive-2.0",
]

[bans]
multiple-versions = "deny"
wildcards = "deny"
# Each duplicate is held back by a dependency whose latest release still pins
# the older version; the skip names the older copy and who pulls it in.
skip = [
    { crate = "base64@0.22.1", reason = "reqwest 0.12 (rustls-tls); 0.13 would swap the compiled-in webpki-roots for the platform verifier, which the scratch image cannot provide" },
    { crate = "getrandom@0.2.17", reason = "ring 0.17, pulled in by rustls through reqwest 0.12" },
    { crate = "tower-http@0.6.11", reason = "reqwest 0.12; the relay itself uses 0.7" },
    { crate = "syn@2.0.119", reason = "tracing-attributes 0.1 and many other proc-macros that have not moved to syn 3" },
    { crate = "miniz_oxide@0.8.9", reason = "png 0.18 through muda in the macOS login helper, next to flate2 which uses 0.9; only seen with --target aarch64-apple-darwin, so the default run warns that it is unmatched" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
